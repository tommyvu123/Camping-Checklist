<script>
    // Initial pre-populated checklist items
    const initialItems = [
      { text: "Marshmallows, sticks", checked: false },
      { text: "Charcoal", checked: false },
      { text: "Red Solo Cups", checked: false },
      { text: "Bug/Mosquito Repellent", checked: true },
      { text: "Firewood", checked: false },
      { text: "Tablecloth", checked: false },
      { text: "Utensils", checked: true },
      { text: "Plates, bowls", checked: false },
      { text: "Icebox", checked: true },
      { text: "Alcohol", checked: false },
      { text: "Pack of water/water gallon jugs", checked: false },
      { text: "Hand sanitizer", checked: false },
      { text: "Paper towels/napkins", checked: false },
      { text: "Galbi", checked: true },
      { text: "Foil, aluminum trays", checked: false },
      { text: "Hersheys cookies and cream", checked: false },
      { text: "Flat rectangular marshmallows", checked: false },
      { text: "Skewers", checked: false },
      { text: "Honey graham crackers", checked: false },
      { text: "2 packs of firewood", checked: false },
      { text: "Lighter fluid", checked: false },
      { text: "Toothbrush, toothpaste", checked: false },
      { text: "Tents", checked: false },
      { text: "Air mattress/sleeping bags", checked: false },
      { text: "Seasoning", checked: false },
      { text: "Portable chargers", checked: false },
      { text: "Shower items", checked: false },
      { text: "Headlamp", checked: false },
      { text: "Burner/stove", checked: true },
      { text: "Floss, Toothbrush, toothpaste, mouthwash", checked: false },
      { text: "Toilet paper", checked: false },
      { text: "Camping chairs", checked: false }
    ];

    const checklistEl = document.getElementById('checklist');
    const todoForm = document.getElementById('todoForm');
    const itemInput = document.getElementById('itemInput');
    const statusBadge = document.getElementById('statusBadge');

    let items = JSON.parse(localStorage.getItem('silverwood_items')) || initialItems;

    function render() {
      checklistEl.innerHTML = '';
      items.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = `item ${item.checked ? 'checked' : ''}`;
        
        li.innerHTML = `
          <div class="item-left" onclick="toggleItem(${index})">
            <div class="checkbox"></div>
            <span class="item-text">${escapeHtml(item.text)}</span>
          </div>
          <button class="delete-btn" onclick="deleteItem(${index})">&times;</button>
        `;
        
        checklistEl.appendChild(li);
      });
      localStorage.setItem('silverwood_items', JSON.stringify(items));
    }

    function toggleItem(index) {
      items[index].checked = !items[index].checked;
      render();
      syncToCloud();
    }

    function deleteItem(index) {
      items.splice(index, 1);
      render();
      syncToCloud();
    }

    todoForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = itemInput.value.trim();
      if (text) {
        items.push({ text, checked: false });
        itemInput.value = '';
        render();
        syncToCloud();
      }
    });

    // Simple cloud sync using npoint JSON store
    const API_URL = "https://api.npoint.io/silverwood_camping_trip_2026";

    async function fetchCloudData() {
      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            items = data;
            render();
          }
        }
      } catch (e) {
        console.log("Offline mode active");
      }
    }

    async function syncToCloud() {
      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(items)
        });
      } catch (e) {
        console.log("Cloud sync delayed");
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    render();
    fetchCloudData();
    setInterval(fetchCloudData, 5000); // Polls updates every 5s for live collaboration
  </script>
